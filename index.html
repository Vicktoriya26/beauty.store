<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V.STORE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Верхня бордова смужка -->
    <div class="top-banner">
        Найкращі світові бренди в одному місці
    </div>


    <!-- HEADER -->
    <header class="header">

        <!-- Верхній рядок -->
        <div class="header-main">

            <!-- Пошук -->
            <div class="search-box">

                <span class="search-icon"></span>

                <input
                    type="text"
                    placeholder="Пошук"
                >

            </div>


            <!-- Логотип -->
            <div class="logo">
                V.STORE
            </div>


            <!-- Іконки -->
            <div class="header-icons">

                <span class="heart-icon">
                    ♡
                </span>

                <span class="user-icon"></span>

                <span class="bag-icon"></span>

            </div>

        </div>


        <!-- Навігація -->
        <nav class="navigation">

            <a href="#">МЕЙКАП</a>

            <a href="#">ОБЛИЧЧЯ</a>

            <a href="#">ВОЛОССЯ</a>

            <a href="#">ТІЛО</a>

            <a href="#">АРОМАТИ</a>

            <a href="#">ПОДАРУНКИ</a>

            <a href="#">ЗНИЖКИ</a>

        </nav>

    </header>


    <!-- БЕСТСЕЛЕРИ -->
    <section class="bestsellers">

        <div class="section-header">

           
        </div>


        <div class="products">

            <div class="product-card">

                <div class="product-image">
                    <span class="badge">Бестселер</span>
                    <span class="favorite">♡</span>
                </div>

                <div class="brand">NARS</div>

                <h2>
                    Radiant creamy
                    concealer Creme...
                </h2>

                <p>
                    Освітлюючий консилер
                    для обличчя
                </p>

                <div class="details">
                    Відтінки: 2<br>
                    Об'єм: 1
                </div>

                <div class="price">
                    1650 ₴
                </div>

            </div>


  

        </div>

    </section>


    <script>

        const favorites =
            document.querySelectorAll('.favorite');

        favorites.forEach(function(button) {

            button.addEventListener('click', function() {

                if (button.classList.contains('active')) {

                    button.classList.remove('active');

                    button.textContent = '♡';

                } else {

                    button.classList.add('active');

                    button.textContent = '♥';

                }

            });

        });
    </script>
    <script src="app.js"></script>


</body>
</html>
